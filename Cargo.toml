[package]
name = "shikigami"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast, lightweight TUI for managing Codex threads across repositories"
license = "MIT"

[[bin]]
name = "shi"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0"
futures = "0.3"
fs2 = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "1.3"
tokio = { version = "1.49", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.24"
